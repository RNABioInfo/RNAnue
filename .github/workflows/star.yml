name: bundled-star
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, generator: Ninja, static: 'OFF'}
          - {os: ubuntu-24.04-arm, generator: 'Unix Makefiles', static: 'OFF'}
          - {os: macos-15-intel, generator: 'Unix Makefiles', static: 'OFF'}
          - {os: macos-15, generator: Ninja, static: 'OFF'}
          - {os: ubuntu-24.04, generator: 'Unix Makefiles', static: 'ON'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build zlib1g-dev xxd patchelf
          echo 'CC=gcc-14' >> "$GITHUB_ENV"
          echo 'CXX=g++-14' >> "$GITHUB_ENV"
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install gcc@14 cmake ninja make
          echo "CC=$(brew --prefix gcc@14)/bin/gcc-14" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix gcc@14)/bin/g++-14" >> "$GITHUB_ENV"
      - name: Build the dependency and locator
        run: |
          cmake -S tests/star -B 'build/star enabled' -G '${{ matrix.generator }}' \
            -DCMAKE_BUILD_TYPE=Release -DRNANUE_STAR_STATIC=${{ matrix.static }}
          cmake --build 'build/star enabled' --parallel 2
      - name: Version, architecture, mapping, relocation and runtime closure
        run: ctest --test-dir 'build/star enabled' --output-on-failure
      - name: Disabled configuration
        run: |
          cmake -S tests/star -B build/star-off -G Ninja -DRNANUE_BUILD_STAR=OFF
          cmake --build build/star-off
          ctest --test-dir build/star-off --output-on-failure
      - name: Missing prerequisites and pin diagnostics
        run: python3 tests/star/configuration.py --cmake cmake --cc "$CC" --cxx "$CXX"
      - name: Incremental build and clean source
        shell: bash
        run: |
          before=$(python3 -c "import os; print(os.stat('build/star enabled/libexec/rnanue/STAR').st_mtime_ns)")
          cmake --build 'build/star enabled' --parallel 2
          after=$(python3 -c "import os; print(os.stat('build/star enabled/libexec/rnanue/STAR').st_mtime_ns)")
          test "$before" = "$after"
          test -z "$(git -C submodules/STAR status --porcelain)"
      - name: Generate archive
        working-directory: build/star enabled
        shell: bash
        run: |
          cpack -G TGZ
          static_argument=()
          if [[ '${{ matrix.static }}' == ON ]]; then static_argument=(--static); fi
          python3 ../../tests/star/package.py --build . --cmake cmake \
            --archive "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)" "${static_argument[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: STAR-${{ matrix.os }}-static-${{ matrix.static }}
          path: build/star enabled/*.tar.gz
      - name: Native installer
        working-directory: build/star enabled
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then cpack -G productbuild; else cpack -G DEB; fi
  regressions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        star: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: RNAnue build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 cmake ninja-build make git pkg-config \
            xxd patchelf autoconf automake libtool python3 gnuplot-nox \
            libboost-program-options-dev libbz2-dev zlib1g-dev liblzma-dev \
            libhts-dev libtbb-dev libpng-dev libncurses-dev
      - name: Build and test RNAnue parameters and pipelines
        run: |
          cmake --preset test -G Ninja -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DRNANUE_BUILD_STAR=${{ matrix.star }}
          cmake --build --preset test --parallel 2
          ctest --preset test
