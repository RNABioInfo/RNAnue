### This file is an example configuration file for the complete RNAnue pipeline.
### Replace the placeholders with the actual paths and values.

### GENERAL
treatment_dir = /path/to/directory # treatments directory. Must contain subdirectories for each sample.
control_dir = /path/to/directory # controls directory. Must contain subdirectories for each sample.
output_dir = /path/to/directory # output directory
log_level = info # log level (debug, info, warning, error; default: info)
threads = 12 # number of threads to use (default: 2)
features = /path/to/file.gff # GFF3 or GTF feature file of the organism of interest
feature_types = exon # comma separated feature types to consider (default: transcript)
orientation = both # orientation of the reads in relation to the features (same, opposite, both; default: both)
mask_multicopy_genes = false # mask multi-copy genes when true (default: false)
chunk_size = 100000 # size of the chunks for the alignment (default: 100000)

### PREPROCESS
preprocess = true # preprocessing of the reads can be either omitted (false) or included (true)
deduplicate = true # remove duplicate reads based on their sequence; set false to disable (default: true)
trim_poly_g = true # trim high quality polyG tails from the reads. Applicable for Illumina NextSeq reads. (default: true)
adapter_5p_forward = /path/to/file.fasta # single sequence or file [.fasta] of the adapter sequences to be removed from the 5' end (forward read if PE)
adapter_3p_forward = /path/to/file.fasta # single sequence or file [.fasta] of the adapter sequences to be removed from the 3' end (forward read if PE)
adapter_5p_reverse = /path/to/file.fasta # single sequence or file [.fasta] of the adapter sequences to be removed from the 5' end of the reverse read (PE only)
adapter_3p_reverse = /path/to/file.fasta # single sequence or file [.fasta] of the adapter sequences to be removed from the 3' end of the reverse read (PE only)
max_adapter_mismatch_rate = 0.05 # rate of mismatches allowed when aligning adapters to sequences (default: 0.05)
min_adapter_overlap = 5 # minimal overlap to trim adapters from the reads (default: 5)
min_read_quality = 20 # lower limit for the mean quality (Phred Quality Score) of the reads (default: 20)
min_read_length = 15 # minimum length of the reads (default: 15)
min_window_quality = 20 # minimum mean quality for each window (Phred Quality Score) (default: 20)
quality_window_size = 0 # window size for quality trimming from 3' end. Selecting '0' will not apply quality trimming (default: 0)
min_merge_overlap = 5 # minimal overlap to merge paired-end reads (default: 5)
max_merge_mismatch_rate = 0.05 # rate of mismatches allowed when merging paired-end reads (default: 0.05)

### ALIGN
aligner = segemehl # default; star uses the bundled executable
reference_genome = /path/to/file.fasta # file [.fasta] of the reference genome
# alignment_index = /path/to/reference.idx # segemehl; use /path/to/STAR_index_directory for STAR
# Requires mask_multicopy_genes = false; the supplied index must match reference_genome.
allow_multimapping = true # consider multimapping alignments; set false to disable (default: true)
seg_alignment_accuracy = 90 # min percentage of matches per read in semi-global alignment
seg_min_fragment_score = 15 # segemehl-specific min fragment score
min_fragment_length = 15 # min length of a spliced fragment
min_split_coverage = 80 # min coverage for spliced transcripts

### STAR PARAMETERS (comment out explicit seg_* settings when selecting STAR)
# aligner = star
# star_max_multimaps = 10 # >=1; outFilterMultimapNmax and chimMultimapNmax; effective cap 1 if allow_multimapping=false
# star_min_junction_overhang = 15 # >=1; chimJunctionOverhangMin; OMIT to inherit min_fragment_length
# star_max_segment_gap = 3 # >=0; chimSegmentReadGapMax
# star_min_nonchimeric_score_drop = 10 # >=0; chimNonchimScoreDropMin
# star_max_chimeric_score_drop = 30 # >=0; chimScoreDropMax
# star_max_intron_length = 10 # >=0; alignIntronMax; 0 uses STAR's automatic bound

### DETECT
min_mapping_quality = 10 # minimum mapping quality of the reads (default: 10)
min_complementarity = 0.5 # complementarity cutoff for split reads (default: 0.0; range: 0.0-1.0)
min_site_length_ratio = 0.1 # aligned portion of the read (default: 0.1, range: 0.0-1.0)
max_hybridization_energy = 0.0 # hybridization energy cutoff for split reads (default: 0.0, range: >=0.0)
exclude_soft_clipping = false # exclude soft clipping from the alignments (default: false)
filter_splicing = false # splicing events are removed in the detection of split reads
remove_alt_splicing = true # remove alternative splicing events; set false to keep them (default: true)
splicing_tolerance = 5 # tolerance for splicing events (default: 5)

### ANALYZE
clustering_distance = 0 # threshold distance at which two clusters are merged into a single combined cluster, default is to only merge overlapping or blunt ended clusters (default: 0)
max_adjusted_p_value = 1.0 # adjusted abundance-corrected within-sample enrichment p-value threshold for outputting an interaction (default: 1.0)
min_interaction_support = 1 # minimum weighted split-read contribution assigned to an interaction (default: 1)
# min_support_per_effective_bp = 0.02 # optional minimum weighted split-read support per effective coverage base pair
# max_coverage_components = 2 # optional maximum number of thresholded coverage islands across both interaction arms
# min_arm_balance = 0.25 # optional minimum ratio between weaker and stronger integrated arm coverage
